services:
  web:
    build: .
    ports:
      - "4173:4173"
    environment:
      NODE_ENV: development
      ENABLE_SAMPLE_CHECKOUT: "true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 5s
      retries: 12
